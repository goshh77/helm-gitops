apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-password
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore

  target:
    name: db-password-secret
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: db-password
