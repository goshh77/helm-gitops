{{- if .Values.sharedIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared-ingress
spec:
  ingressClassName: {{ .Values.sharedIngress.className }}
  rules:
    - http:
        paths:
{{- range .Values.sharedIngress.routes }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: 80
{{- end }}
{{- end }}
